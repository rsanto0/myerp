AWSTemplateFormatVersion: '2010-09-09'
Description: 'MyERP - Route 53 DNS Configuration'

Parameters:
  DomainName:
    Type: String
    Default: myerp.com
    Description: Domain name for MyERP
  
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  
  LoadBalancerDNS:
    Type: String
    Description: ALB DNS Name from infrastructure stack

Resources:
  # Hosted Zone
  MyErpHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Sub '${Environment}.${DomainName}'
      HostedZoneConfig:
        Comment: !Sub 'MyERP ${Environment} environment'

  # API Gateway Record
  APIGatewayRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyErpHostedZone
      Name: !Sub 'api.${Environment}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref LoadBalancerDNS
        HostedZoneId: Z35SXDOTRQ7X7K # ALB Hosted Zone ID for us-east-1
        EvaluateTargetHealth: true

  # Eureka Service Discovery
  EurekaRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyErpHostedZone
      Name: !Sub 'eureka.${Environment}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref LoadBalancerDNS
        HostedZoneId: Z35SXDOTRQ7X7K
        EvaluateTargetHealth: true

  # Auth Service
  AuthServiceRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyErpHostedZone
      Name: !Sub 'auth.${Environment}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref LoadBalancerDNS
        HostedZoneId: Z35SXDOTRQ7X7K
        EvaluateTargetHealth: true

  # RH Module
  RHServiceRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyErpHostedZone
      Name: !Sub 'rh.${Environment}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref LoadBalancerDNS
        HostedZoneId: Z35SXDOTRQ7X7K
        EvaluateTargetHealth: true

  # Biometria Module
  BiometriaServiceRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyErpHostedZone
      Name: !Sub 'biometria.${Environment}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref LoadBalancerDNS
        HostedZoneId: Z35SXDOTRQ7X7K
        EvaluateTargetHealth: true

  # Monitoring Dashboard
  MonitoringRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyErpHostedZone
      Name: !Sub 'monitoring.${Environment}.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !Ref LoadBalancerDNS
        HostedZoneId: Z35SXDOTRQ7X7K
        EvaluateTargetHealth: true

  # Health Check para API Gateway
  APIHealthCheck:
    Type: AWS::Route53::HealthCheck
    Properties:
      Type: HTTPS
      ResourcePath: /actuator/health
      FullyQualifiedDomainName: !Sub 'api.${Environment}.${DomainName}'
      Port: 443
      RequestInterval: 30
      FailureThreshold: 3
      Tags:
        - Key: Name
          Value: !Sub 'MyERP-API-HealthCheck-${Environment}'

Outputs:
  HostedZoneId:
    Description: Route 53 Hosted Zone ID
    Value: !Ref MyErpHostedZone
    Export:
      Name: !Sub '${AWS::StackName}-HostedZone-ID'
  
  APIDomain:
    Description: API Gateway Domain
    Value: !Sub 'api.${Environment}.${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-API-Domain'