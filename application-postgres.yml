# Configuração PostgreSQL comum para todos os módulos
# Use este arquivo como referência para configurar cada módulo

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # URL será específica para cada módulo
    url: jdbc:postgresql://localhost:5432/myerp_db
    username: myerp_user
    password: myerp_pass
    
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo

# Configurações específicas por módulo:
# 
# Auth Service:
#   url: jdbc:postgresql://localhost:5432/auth_db
#
# RH Module:
#   url: jdbc:postgresql://localhost:5432/rh_db
#
# Biometria Module:
#   url: jdbc:postgresql://localhost:5432/biometria_db