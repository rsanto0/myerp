server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: financial-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  # Hot Deploy Configuration
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/myerp_financial}
    username: ${DATABASE_USERNAME:myerp_user}
    password: ${DATABASE_PASSWORD:myerp_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: financial_schema
  
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.myerp.financial: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/myerp_financial
    username: myerp_user
    password: myerp_pass
    driver-class-name: org.postgresql.Driver

---
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: ${DB_URL:jdbc:postgresql://myerp-db.cluster-xyz.us-east-1.rds.amazonaws.com:5432/myerp_financial}
    username: ${DB_USERNAME:myerp_user}
    password: ${DB_PASSWORD:myerp_pass}
    driver-class-name: org.postgresql.Driver