# Profile para produção
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biometria_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:myerp_user}
    password: ${DB_PASS:myerp_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
  instance:
    hostname: ${EUREKA_HOSTNAME:biometria-service}

logging:
  level:
    com.myerp.biometria: INFO
    org.springframework.mail: WARN