server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: biometria-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  # Desabilitar completamente o Spring Mail
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Email Mock (para testes)
email:
  mock:
    enabled: true

# Configurações do módulo biometria
biometria:
  camera:
    enabled: false # Para testes, usar simulador
    confidence-threshold: 0.8
  
  tolerancia:
    entrada: 15 # minutos
    saida: 15
    almoco: 15
  
  horarios-padrao:
    entrada: "08:00"
    saida-almoco: "12:00"
    retorno-almoco: "13:00"
    saida: "17:00"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    instance-info-replication-interval-seconds: 30
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    com.myerp.biometria: DEBUG
    org.springframework.mail: DEBUG