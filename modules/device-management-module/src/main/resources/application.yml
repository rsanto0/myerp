server:
  port: 8087

spring:
  application:
    name: device-management-module
  
  profiles:
    active: local
  
  datasource:
    url: jdbc:postgresql://localhost:5432/myerp_devices
    username: myerp_user
    password: myerp_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.myerp.device: INFO
    org.springframework.web: DEBUG