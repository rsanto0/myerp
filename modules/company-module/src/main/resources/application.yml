server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: company-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  # Hot Deploy Configuration
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
    livereload:
      enabled: true
  
  # Configuração do banco de dados
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/myerp_company}
    username: ${DATABASE_USERNAME:myerp_user}
    password: ${DATABASE_PASSWORD:myerp_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update # Desenvolvimento sem Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: company_schema
  
  flyway:
    enabled: false

# Configurações do módulo company
company:
  multi-tenant:
    enabled: true
  feature-flags:
    enabled: true
  maintenance:
    groups: 3 # A, B, C
    window-hours: 2 # 2h de janela

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    instance-info-replication-interval-seconds: 30
    healthcheck:
      enabled: true
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.myerp.company: DEBUG
    org.flywaydb: INFO