# Profile para ambiente Docker
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/rh_db
    driver-class-name: org.postgresql.Driver
    username: myerp_user
    password: myerp_pass
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

auth:
  service:
    url: http://auth-service:8081