name: Sync Postman Collections

on:
  push:
    paths:
      - 'postman/**'
  workflow_dispatch:

jobs:
  sync-postman:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Newman
      run: npm install -g newman
      
    - name: Validate Collections
      run: |
        newman run postman/MyERP-System.postman_collection.json \
          -e postman/MyERP-Environment.postman_environment.json \
          --reporters cli,json \
          --reporter-json-export results.json || true
          
    - name: Upload to Postman Cloud
      env:
        POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        COLLECTION_UID: ${{ secrets.COLLECTION_UID }}
      run: |
        curl -X PUT \
          "https://api.getpostman.com/collections/${COLLECTION_UID}" \
          -H "X-API-Key: ${POSTMAN_API_KEY}" \
          -H "Content-Type: application/json" \
          -d @postman/MyERP-System.postman_collection.json
          
    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚀 Postman collection sincronizada com sucesso!'
          })